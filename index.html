<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cedric &amp; Samira – Ein Strichmännchen-Film</title>
<style>
  :root { --ink:#2b2b3a; --cream:#fff8ec; --pink:#f0738a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#1d1b2a; color:#fff;
    font-family:"Comic Sans MS","Chalkboard SE","Segoe Print","Comic Neue",cursive,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; gap:10px; }
  #stage { position:relative; width:min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio:16/9;
    border-radius:14px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.5); background:var(--cream); }
  canvas { width:100%; height:100%; display:block; cursor:pointer; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(29,27,42,.55); text-align:center; padding:16px; }
  #overlay.hidden { display:none; }
  #overlay button { font:inherit; font-size:clamp(18px,3.2vw,30px); padding:.5em 1.2em; border-radius:999px; border:4px solid var(--ink);
    background:var(--pink); color:#fff; cursor:pointer; box-shadow:0 5px 0 var(--ink); }
  #overlay button:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  #bar { width:min(100%, calc((100vh - 110px) * 16 / 9)); display:flex; align-items:center; gap:8px; }
  #bar button { font:inherit; font-size:16px; min-width:44px; height:40px; border-radius:10px; border:0; background:#35324a; color:#fff; cursor:pointer; }
  #bar button:hover { background:#4a4666; }
  #prog { flex:1; height:14px; background:#35324a; border-radius:7px; position:relative; cursor:pointer; overflow:hidden; }
  #fill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--pink); }
  .tick { position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,.35); }
  #label { width:min(100%, calc((100vh - 110px) * 16 / 9)); font-size:14px; opacity:.8; display:flex; justify-content:space-between; gap:10px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="overlay"><button id="start">&#9654;&#xFE0E; Film starten</button></div>
</div>
<div id="bar">
  <button id="prev" title="Vorherige Szene">&laquo;</button>
  <button id="pp" title="Play / Pause (Leertaste)">&#9654;&#xFE0E;</button>
  <button id="next" title="Nächste Szene">&raquo;</button>
  <div id="prog"><div id="fill"></div></div>
  <button id="fs" title="Vollbild">&#x26F6;&#xFE0E;</button>
</div>
<div id="label"><span id="sc"></span><span id="tm"></span></div>

<script>
'use strict';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const W = 1280, H = 720, PI = Math.PI;
const INK = '#2b2b3a', CREAM = '#fff8ec';
const FONT = '"Comic Sans MS","Chalkboard SE","Segoe Print","Comic Neue",cursive,sans-serif';
const BLUE = '#2f6fde', ROSE = '#c23a5a';

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a)));
const inT = (t, a, b) => t >= a && t < b;
const rnd = i => { const v = Math.sin(i * 127.1 + 3.3) * 43758.5453; return v - Math.floor(v); };

function rr(x, y, w, h, r) {
  X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r);
  X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath();
}
function text(s, x, y, size = 28, col = INK, align = 'center', bold = false) {
  X.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; X.textAlign = align; X.textBaseline = 'middle';
  X.fillStyle = col; X.fillText(s, x, y);
}
function wrap(s, maxW) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (X.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
  }
  if (line) out.push(line); return out;
}
function heart(x, y, s, col = '#f0506e', a = 1) {
  X.save(); X.globalAlpha *= a; X.translate(x, y); X.scale(s / 20, s / 20); X.fillStyle = col;
  X.beginPath(); X.moveTo(0, 8); X.bezierCurveTo(-22, -8, -10, -24, 0, -10); X.bezierCurveTo(10, -24, 22, -8, 0, 8);
  X.fill(); X.restore();
}
function hearts(t, x, y, n = 6, spread = 80, from = 0) {
  for (let i = 0; i < n; i++) {
    const p = ((t - from) * .35 + rnd(i + 5)) % 1; if (t < from) continue;
    heart(x + (rnd(i) - .5) * spread * 2 + Math.sin(t * 2 + i) * 10, y - p * 190, 14 + rnd(i + 9) * 16, i % 2 ? '#f0506e' : '#ff8fa8', Math.sin(p * PI));
  }
}
function sky(c1, c2, c3) {
  const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(.7, c2); if (c3) g.addColorStop(1, c3);
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function stars(t, n = 60, maxY = .55) {
  for (let i = 0; i < n; i++) {
    X.globalAlpha = .4 + .6 * Math.abs(Math.sin(t * 1.5 + i)); X.fillStyle = '#fff';
    X.beginPath(); X.arc(rnd(i) * W, rnd(i + 99) * H * maxY, 1 + rnd(i + 3) * 2, 0, 7); X.fill();
  }
  X.globalAlpha = 1;
}
function moon(x, y, r = 40) { X.fillStyle = '#fff6c9'; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); X.fillStyle = 'rgba(0,0,0,.06)'; X.beginPath(); X.arc(x - 12, y - 8, r * .2, 0, 7); X.arc(x + 12, y + 12, r * .14, 0, 7); X.fill(); }
function ground(y, col) { X.fillStyle = col; X.fillRect(0, y, W, H - y); }
function snow(t, n = 80) {
  X.fillStyle = '#fff';
  for (let i = 0; i < n; i++) {
    X.beginPath(); X.arc((rnd(i) * W + Math.sin(t + i) * 22 + W) % W, (rnd(i + 7) * H + t * (35 + rnd(i + 3) * 45)) % H, 2 + rnd(i + 1) * 3, 0, 7); X.fill();
  }
}
function lampions(t, y0, n = 12) {
  X.strokeStyle = '#555'; X.lineWidth = 2; X.beginPath();
  for (let i = 0; i <= n; i++) { const x = i * W / n, y = y0 + Math.sin(i / n * PI * 3) * 22 + 20; i ? X.lineTo(x, y) : X.moveTo(x, y); } X.stroke();
  const cols = ['#ffd166', '#ef476f', '#06d6a0', '#74b9ff', '#ff9f43'];
  for (let i = 0; i <= n; i++) {
    const x = i * W / n, y = y0 + Math.sin(i / n * PI * 3) * 22 + 34;
    X.fillStyle = cols[i % 5]; X.globalAlpha = .75 + .25 * Math.sin(t * 3 + i); X.beginPath(); X.arc(x, y, 13, 0, 7); X.fill();
  } X.globalAlpha = 1;
}

/* ---------- stick figures ---------- */
function head(x, hy, r, o = {}) {
  const s = r / 23, dir = o.dir ?? 1, face = o.face || 'smile', c = o.c || INK;
  X.lineWidth = 5 * s; X.lineCap = 'round'; X.lineJoin = 'round'; X.strokeStyle = c;
  if (o.hair === 'long') {
    X.fillStyle = o.hc; X.beginPath(); X.moveTo(x - r * 1.1, hy - r * .15);
    X.quadraticCurveTo(x - r * 1.55, hy + r * 1.7, x - r * .95, hy + r * 2.4); X.lineTo(x + r * .95, hy + r * 2.4);
    X.quadraticCurveTo(x + r * 1.55, hy + r * 1.7, x + r * 1.1, hy - r * .15); X.arc(x, hy - r * .15, r * 1.1, 0, PI, true); X.fill();
  }
  X.fillStyle = face === 'back' ? (o.hc || '#555') : '#fff'; X.beginPath(); X.arc(x, hy, r, 0, 7); X.fill(); X.stroke();
  // hair on top
  X.fillStyle = o.hc || '#555';
  const capTop = () => { X.beginPath(); X.arc(x, hy, r * 1.06, PI * 1.08, PI * 1.92); X.closePath(); X.fill(); };
  if (o.hair === 'short') { capTop(); X.beginPath(); X.arc(x + dir * r * .3, hy - r * 1.0, r * .32, 0, 7); X.fill(); }
  else if (o.hair === 'long') { X.beginPath(); X.arc(x, hy, r * 1.08, PI * 1.02, PI * 1.98); X.quadraticCurveTo(x + dir * r * .2, hy - r * .35, x - r * 1.05, hy - r * .05); X.fill(); }
  else if (o.hair === 'bun') { capTop(); X.beginPath(); X.arc(x, hy - r * 1.25, r * .42, 0, 7); X.fill(); }
  else if (o.hair === 'cap') { capTop(); X.fillRect(x + (dir >= 0 ? 0 : -r * 1.5), hy - r * .62, r * 1.5, r * .2); }
  else if (o.hair === 'spiky') { X.beginPath(); X.moveTo(x - r, hy - r * .4); for (let i = 0; i <= 6; i++) X.lineTo(x - r + i * r / 3, hy - r * (i % 2 ? 1.5 : .85)); X.lineTo(x + r, hy - r * .4); X.closePath(); X.fill(); }
  else if (o.hair === 'curly') { for (let i = 0; i < 7; i++) { const a = PI + i * PI / 6; X.beginPath(); X.arc(x + Math.cos(a) * r, hy + Math.sin(a) * r, r * .34, 0, 7); X.fill(); } }
  if (face === 'back') return;
  const ex = x + dir * 5 * s, ey = hy - 2 * s;
  if (o.blush) { X.fillStyle = 'rgba(255,120,150,.55)'; X.beginPath(); X.ellipse(ex - 13 * s, hy + 7 * s, 5.5 * s, 3.5 * s, 0, 0, 7); X.ellipse(ex + 13 * s, hy + 7 * s, 5.5 * s, 3.5 * s, 0, 0, 7); X.fill(); }
  X.fillStyle = INK; X.strokeStyle = INK; X.lineWidth = 3 * s;
  const dot = (dx, rr2 = 2.8) => { X.beginPath(); X.arc(ex + dx * s, ey, rr2 * s, 0, 7); X.fill(); };
  const mouth = (kind) => {
    X.beginPath();
    if (kind === 'smile') X.arc(ex, hy + 3 * s, 8 * s, .15 * PI, .85 * PI);
    else if (kind === 'sad') X.arc(ex, hy + 15 * s, 7 * s, 1.2 * PI, 1.8 * PI);
    else if (kind === 'flat') { X.moveTo(ex - 6 * s, hy + 10 * s); X.lineTo(ex + 6 * s, hy + 10 * s); }
    else if (kind === 'o') { X.arc(ex, hy + 10 * s, 4 * s, 0, 7); }
    else if (kind === 'wavy') { X.moveTo(ex - 8 * s, hy + 10 * s); X.quadraticCurveTo(ex - 4 * s, hy + 5 * s, ex, hy + 10 * s); X.quadraticCurveTo(ex + 4 * s, hy + 15 * s, ex + 8 * s, hy + 10 * s); }
    X.stroke();
  };
  if (face === 'laugh') {
    X.beginPath(); X.arc(ex - 8 * s, ey + 2 * s, 4 * s, PI * 1.1, PI * 1.9); X.stroke(); X.beginPath(); X.arc(ex + 8 * s, ey + 2 * s, 4 * s, PI * 1.1, PI * 1.9); X.stroke();
    X.fillStyle = '#b3364f'; X.beginPath(); X.arc(ex, hy + 6 * s, 8 * s, 0, PI); X.closePath(); X.fill(); X.stroke();
  } else if (face === 'love') { heart(ex - 8 * s, ey + 1 * s, 9 * s); heart(ex + 8 * s, ey + 1 * s, 9 * s); mouth('smile'); }
  else if (face === 'dizzy') {
    for (const d of [-8, 8]) { X.beginPath(); X.moveTo(ex + (d - 4) * s, ey - 4 * s); X.lineTo(ex + (d + 4) * s, ey + 4 * s); X.moveTo(ex + (d + 4) * s, ey - 4 * s); X.lineTo(ex + (d - 4) * s, ey + 4 * s); X.stroke(); }
    mouth('wavy');
  } else if (face === 'o') { dot(-8, 3.6); dot(8, 3.6); mouth('o'); }
  else { dot(-8); dot(8); mouth(face); }
  if (o.sweat) { X.fillStyle = '#6ec6ff'; const sx = x - dir * r * 1.15, sy = hy - r * .5; X.beginPath(); X.moveTo(sx, sy - 9 * s); X.quadraticCurveTo(sx + 7 * s, sy + 4 * s, sx, sy + 6 * s); X.quadraticCurveTo(sx - 7 * s, sy + 4 * s, sx, sy - 9 * s); X.fill(); }
}

function fig(x, y, o = {}) {
  const s = o.s || 1, c = o.c || INK, sit = o.sit || 0;
  const hipY = y - (sit ? 46 : 62) * s + (o.bob || 0), neckY = hipY - 58 * s, r = 23 * s, hy = neckY - r + 2 * s;
  X.save();
  if (o.rot) { X.translate(x, hipY); X.rotate(o.rot); X.translate(-x, -hipY); }
  X.lineWidth = 5 * s; X.lineCap = 'round'; X.lineJoin = 'round'; X.strokeStyle = c;
  X.beginPath();
  if (sit) {
    X.moveTo(x, hipY); X.lineTo(x + sit * 38 * s, hipY + 2 * s); X.lineTo(x + sit * 40 * s, y);
    X.moveTo(x, hipY); X.lineTo(x + sit * 28 * s, hipY + 8 * s); X.lineTo(x + sit * 28 * s, y);
  } else {
    const w = o.walk !== undefined ? Math.sin(o.walk) * 20 * s : 0, fy = y + (o.bob && !o.walk ? o.bob : 0);
    X.moveTo(x, hipY); X.lineTo(x - 11 * s + w, fy); X.moveTo(x, hipY); X.lineTo(x + 11 * s - w, fy);
  }
  X.moveTo(x, neckY); X.lineTo(x, hipY); X.stroke();
  if (o.dress) {
    X.fillStyle = o.dress; X.beginPath(); X.moveTo(x, neckY + 6 * s); X.lineTo(x - 25 * s, hipY + 20 * s); X.lineTo(x + 25 * s, hipY + 20 * s); X.closePath(); X.fill(); X.stroke();
  }
  const sy = neckY + 12 * s, L = 50 * s, aL = o.aL ?? -.35, aR = o.aR ?? .35;
  const hl = { x: x + Math.sin(aL) * L, y: sy + Math.cos(aL) * L }, hr = { x: x + Math.sin(aR) * L, y: sy + Math.cos(aR) * L };
  X.beginPath(); X.moveTo(x, sy); X.lineTo(hl.x, hl.y); X.moveTo(x, sy); X.lineTo(hr.x, hr.y); X.stroke();
  head(x, hy, r, o);
  X.restore();
  if (o.name) { text(o.name, x, y + 24, 20, o.nc || c, 'center', true); }
  return { hl, hr, top: hy - r, hy, x };
}
const C = (x, y, o) => fig(x, y, { c: BLUE, hair: 'short', hc: '#6b4423', ...o });
const S = (x, y, o) => fig(x, y, { c: ROSE, hair: 'long', hc: '#4a2a1a', dress: '#f58aa0', ...o });
const topY = (y, s = 1, sit = 0) => y - (sit ? 152 : 168) * s;

/* ---------- bubbles & captions ---------- */
function bubble(str, x, y, o = {}) {
  const a = o.a ?? 1, fs = o.fs || 26; X.font = `${fs}px ${FONT}`;
  const lines = wrap(str, o.w || 330), tw = Math.max(...lines.map(l => X.measureText(l).width));
  const bw = tw + 36, bh = lines.length * fs * 1.25 + 24;
  const bx = clamp(x + (o.dx || 0) - bw / 2, 12, W - bw - 12), by = Math.max(10, y - 44 - bh);
  X.save(); X.globalAlpha = a; const k = .8 + .2 * a; X.translate(x, y); X.scale(k, k); X.translate(-x, -y);
  X.lineWidth = 3.5; X.strokeStyle = INK; X.fillStyle = '#fff';
  rr(bx, by, bw, bh, 20); X.fill(); X.stroke();
  const tx = clamp(x, bx + 30, bx + bw - 30), bb = by + bh;
  if (o.think) { for (const [f, r] of [[.3, 9], [.65, 6], [.95, 4]]) { X.beginPath(); X.arc(lerp(tx, x, f), lerp(bb + 4, y - 4, f), r, 0, 7); X.fill(); X.stroke(); } }
  else {
    X.beginPath(); X.moveTo(tx - 13, bb - 2); X.lineTo(x, y - 6); X.lineTo(tx + 13, bb - 2); X.fill(); X.stroke();
    X.strokeStyle = '#fff'; X.lineWidth = 5; X.beginPath(); X.moveTo(tx - 10, bb - 2.5); X.lineTo(tx + 10, bb - 2.5); X.stroke();
  }
  lines.forEach((l, i) => text(l, bx + bw / 2, by + 12 + fs * .62 + i * fs * 1.25, fs, o.col || INK, 'center', o.bold));
  X.restore();
}
function say(t, a, b, str, x, y, o = {}) {
  if (!inT(t, a, b)) return; bubble(str, x, y, { ...o, a: Math.min(clamp((t - a) / .25), clamp((b - t) / .25)) });
}
function cap(t, a, b, str) {
  if (!inT(t, a, b)) return; const al = Math.min(clamp((t - a) / .35), clamp((b - t) / .35));
  X.save(); X.globalAlpha = al; X.font = `26px ${FONT}`; const lines = wrap(str, 1050), tw = Math.max(...lines.map(l => X.measureText(l).width));
  const bh = lines.length * 34 + 22, by = H - 16 - bh; X.fillStyle = 'rgba(30,28,45,.82)'; rr(W / 2 - tw / 2 - 26, by, tw + 52, bh, 18); X.fill();
  lines.forEach((l, i) => text(l, W / 2, by + 28 + i * 34, 26, '#fff')); X.restore();
}
function pop(t, a, b, str, x, y, size = 40, col = '#f0506e', rot = 0) {
  if (!inT(t, a, b)) return; const p = (t - a) / (b - a);
  X.save(); X.translate(x, y - p * 20); X.rotate(rot); const k = .6 + .5 * Math.sin(Math.min(p * 3, 1) * PI / 2); X.scale(k, k); X.globalAlpha = Math.min(1, (1 - p) * 3);
  X.lineWidth = 8; X.strokeStyle = '#fff'; X.font = `bold ${size}px ${FONT}`; X.textAlign = 'center'; X.textBaseline = 'middle'; X.strokeText(str, 0, 0);
  text(str, 0, 0, size, col, 'center', true); X.restore();
}

/* ---------- props ---------- */
function beer(x, y, s = 1) {
  X.save(); X.translate(x, y); X.scale(s, s); X.lineWidth = 3; X.strokeStyle = INK;
  X.fillStyle = '#ffc93c'; rr(-13, -34, 26, 36, 4); X.fill(); X.stroke(); X.fillStyle = '#fff'; rr(-15, -42, 30, 12, 6); X.fill(); X.stroke();
  X.beginPath(); X.arc(15, -16, 9, -PI / 2, PI / 2); X.stroke(); X.restore();
}
function mug(x, y, t) {
  X.lineWidth = 3; X.strokeStyle = INK; X.fillStyle = '#d6453d'; rr(x - 11, y - 20, 22, 24, 4); X.fill(); X.stroke(); X.beginPath(); X.arc(x + 12, y - 8, 7, -PI / 2, PI / 2); X.stroke();
  X.strokeStyle = 'rgba(255,255,255,.8)'; X.lineWidth = 2.5;
  for (let i = -1; i <= 1; i += 2) { X.beginPath(); X.moveTo(x + i * 4, y - 24); X.quadraticCurveTo(x + i * 4 + Math.sin(t * 3 + i) * 6, y - 36, x + i * 4, y - 46); X.stroke(); }
}
function cocktail(x, y, col) {
  X.lineWidth = 3; X.strokeStyle = INK; X.fillStyle = col; X.beginPath(); X.moveTo(x - 20, y - 50); X.lineTo(x + 20, y - 50); X.lineTo(x, y - 22); X.closePath(); X.fill(); X.stroke();
  X.beginPath(); X.moveTo(x, y - 22); X.lineTo(x, y); X.moveTo(x - 12, y); X.lineTo(x + 12, y); X.stroke();
  X.strokeStyle = '#2e9e6b'; X.beginPath(); X.moveTo(x + 4, y - 40); X.lineTo(x + 18, y - 68); X.stroke();
  X.fillStyle = '#ffd166'; X.beginPath(); X.arc(x - 16, y - 52, 7, 0, 7); X.fill();
}
function card2(x, y, col = '#3d7bff') { X.fillStyle = col; X.strokeStyle = INK; X.lineWidth = 2.5; rr(x - 17, y - 12, 34, 23, 4); X.fill(); X.stroke(); X.fillStyle = '#ffd166'; X.fillRect(x - 11, y - 5, 9, 7); }
function note(x, y) { X.fillStyle = '#8fd694'; X.strokeStyle = INK; X.lineWidth = 2.5; rr(x - 20, y - 11, 40, 22, 3); X.fill(); X.stroke(); text('20', x, y + 1, 14, INK, 'center', true); }
function car(x, y, col, s = 1, t = 0, old = false) {
  X.save(); X.translate(x, y + Math.sin(t * 14) * 1.5 * s); X.scale(s, s); X.lineWidth = 4; X.strokeStyle = INK; X.lineJoin = 'round';
  X.fillStyle = col; X.beginPath(); X.moveTo(-82, -68); X.quadraticCurveTo(-62, -124, -12, -124); X.lineTo(48, -124); X.quadraticCurveTo(84, -120, 100, -68); X.closePath(); X.fill(); X.stroke();
  rr(-130, -70, 260, 52, 18); X.fill(); X.stroke();
  X.fillStyle = '#dff3ff'; X.beginPath(); X.moveTo(-64, -72); X.quadraticCurveTo(-50, -112, -12, -112); X.lineTo(44, -112); X.quadraticCurveTo(70, -108, 82, -72); X.closePath(); X.fill(); X.stroke();
  X.fillStyle = '#ffe97a'; X.beginPath(); X.arc(124, -50, 8, 0, 7); X.fill(); X.stroke();
  if (old) { X.fillStyle = '#a8673a'; X.beginPath(); X.arc(-95, -40, 7, 0, 7); X.arc(-84, -34, 4, 0, 7); X.fill(); }
  for (const wx of [-76, 76]) { X.fillStyle = '#333'; X.beginPath(); X.arc(wx, -18, 22, 0, 7); X.fill(); X.stroke(); X.fillStyle = '#bbb'; X.beginPath(); X.arc(wx, -18, 8, 0, 7); X.fill(); }
  X.restore();

  const sa = S(sx, 620, { s: 1.4, dir: -1, walk: wk !== undefined ? wk + 1.5 : undefined, face: inT(t, 11, 14.5) ? 'o' : inT(t, 14.5, 19) ? 'wavy' : t > 25 ? 'love' : 'smile', blush: t > 11, sweat: inT(t, 11, 22), aL: hold ? lerp(-.35, -1.1, hold) : -.35, aR: inT(t, 14.5, 17) ? 2.6 : .35 });
  const ty = topY(620, 1.4);
  say(t, 6, 11, 'Hey Samira … willst du mit mir zusammen sein?', cx, ty, { w: 360, fs: 28 });
  pop(t, 11, 14.3, '!?', sx + 6, ty - 50, 90, '#ffd166');
  say(t, 14.5, 19, 'Ja … okay … ich weiss nicht … aber JA!', sx, ty, { w: 330, fs: 28 });
  if (yes) { hearts(t, (cx + sx) / 2, 420, 9, 190, 19); pop(t, 19, 21, 'JA!', (cx + sx) / 2, 300, 100, '#ff5c7a'); }
  if (hold > .9) heart((cx + sx) / 2, 330 + Math.sin(t * 3) * 8, 70 + Math.sin(t * 6) * 8);
  cap(t, 0.5, 5, 'Nach dem Essen gehen sie auf die Bundesterrasse.');
  cap(t, 11.2, 14.4, 'Samira ist komplett überrumpelt.');
  cap(t, 21, 27, '(Danach ist sie zuerst noch etwas unsicher. Aber das weiss Cedric noch nicht.)');
  cap(t, 27.5, 36, 'Und im Endeffekt ist sie überglücklich, dass sie damals Ja gesagt hat.');
});

/* Finale */
add('4 Jahre später', 18, t => {
  sky('#ffd3e0', '#ffe9c7', '#fff8ec');
  X.fillStyle = '#ffe08a'; X.beginPath(); X.arc(640, 640, 240 + Math.sin(t * 2) * 6, 0, 7); X.fill(); ground(600, '#a6d49a');
  for (let i = 0; i < 22; i++) { const p = (t * .12 * (1 + rnd(i)) + rnd(i + 9)) % 1; heart(rnd(i) * W + Math.sin(t + i) * 20, H - p * H, 14 + rnd(i + 2) * 26, i % 3 ? '#f0506e' : '#ff9fb5', Math.sin(p * PI) * .8); }
  const b = Math.sin(t * 4) * 6;
  C(570, 600, { s: 1.5, bob: b, aR: 1.1, aL: -2.6, face: 'laugh', blush: true }); S(710, 600, { s: 1.5, dir: -1, bob: -b, aL: -1.1, aR: 2.6, face: 'laugh', blush: true });
  heart(640, 300 + Math.sin(t * 3) * 6, 60 + Math.sin(t * 6) * 8);
  const line = (a, s, y, size, col) => { if (t < a) return; X.globalAlpha = clamp((t - a) / .6); text(s, W / 2, y, size, col, 'center', true); X.globalAlpha = 1; };
  line(.6, '4 Jahre später …', 90, 64, INK); line(4.5, 'Immer noch zusammen.', 170, 40, '#c23a5a'); line(8, 'Und immer noch happy. Jeden Tag.', 222, 40, '#c23a5a');
  if (t > 12.5) { X.globalAlpha = clamp((t - 12.5) / .8); X.fillStyle = 'rgba(255,248,236,.9)'; rr(440, 640, 400, 66, 22); X.fill(); text('Ende', 620, 674, 44, INK, 'center', true); heart(710, 676, 30); X.globalAlpha = 1; }
});

/* ---------- player ---------- */
let acc = 0; for (const s of scenes) { s.start = acc; acc += s.dur; }
const TOTAL = acc; let T = 0, playing = false, last = 0;
const $ = id => document.getElementById(id), fill = $('fill'), pp = $('pp'), overlay = $('overlay'), startBtn = $('start');
for (const s of scenes) if (s.start) { const d = document.createElement('div'); d.className = 'tick'; d.style.left = (s.start / TOTAL * 100) + '%'; $('prog').appendChild(d); }
const sceneAt = T => { for (let i = scenes.length - 1; i >= 0; i--) if (T >= scenes[i].start) return i; return 0; };
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function render() {
  const i = sceneAt(T), s = scenes[i], t = Math.min(T - s.start, s.dur - .001);
  X.save(); X.globalAlpha = 1; X.clearRect(0, 0, W, H); s.draw(t); X.restore();
  const f = Math.max(1 - t / .35, (t - (s.dur - .35)) / .35);
  if (f > 0 && !(i === scenes.length - 1 && t > 1)) { X.fillStyle = `rgba(255,248,236,${clamp(f)})`; X.fillRect(0, 0, W, H); }
  fill.style.width = (T / TOTAL * 100) + '%'; $('sc').textContent = s.title; $('tm').textContent = fmt(T) + ' / ' + fmt(TOTAL);
}
function frame(now) {
  if (playing) { T += Math.min(.1, (now - last) / 1000); if (T >= TOTAL) { T = TOTAL - .01; setPlay(false); startBtn.innerHTML = '&#8635; Nochmal schauen'; overlay.classList.remove('hidden'); } }
  last = now; render(); requestAnimationFrame(frame);
}
function setPlay(p) { playing = p; pp.innerHTML = p ? '&#10074;&#10074;' : '&#9654;&#xFE0E;'; if (p) overlay.classList.add('hidden'); }
function toggle() { if (!playing && T >= TOTAL - .05) T = 0; setPlay(!playing); }
function seek(v) { T = clamp(v, 0, TOTAL - .01); overlay.classList.add('hidden'); render(); }
startBtn.onclick = () => { if (T >= TOTAL - .05) T = 0; setPlay(true); };
pp.onclick = toggle; cv.onclick = toggle;
$('next').onclick = () => { const i = sceneAt(T); seek(i < scenes.length - 1 ? scenes[i + 1].start : TOTAL); };
$('prev').onclick = () => { const i = sceneAt(T); seek(T - scenes[i].start > 1.5 || i === 0 ? scenes[i].start : scenes[i - 1].start); };
$('prog').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); };
$('fs').onclick = () => { const el = $('stage'); document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } else if (e.code === 'ArrowRight') $('next').click(); else if (e.code === 'ArrowLeft') $('prev').click(); });
window.__film = { seek, scenes, TOTAL, render };
requestAnimationFrame(frame);
</script>
